<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drawbox Mini</title>
    <style>
      :root {
        --accent: #db8eae;
        --accent-dark: #b21c0e;
        --font-color: #1f1c1c;
        --bg-color: #f7f3f3;
        --borders: #ac295b;
        --nav-hover-bg: #620d1d;
        --nav-hover-text: #ffffff;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --accent: #b21c0e;
          --accent-dark: #f53e84;
          --font-color: #ecdddd;
          --bg-color: #1a1818;
          --borders: #cb0e40;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: sans-serif;
        margin: 0;
        padding: 10px;
        color: var(--font-color);
        background-color: var(--bg-color);
      }

      canvas {
        border: 3px solid var(--borders);
        cursor: crosshair;
        touch-action: none;
        border-radius: 10px;
      }

      #gallery {
        display: flex;
        flex-wrap: nowrap;
        overflow-x: auto;
        gap: 10px;
        margin-top: 15px;
        padding: 10px 0;
      }

      .image-container {
        border: 3px solid var(--borders);
        padding: 5px;
        min-width: 150px;
        text-align: center;
        border-radius: 10px;
        flex-shrink: 0;
      }

      .image-container p {
        color: #ffffff;
        margin: 5px 0 0 0;
        font-size: 0.85em;
        background: rgba(0, 0, 0, 0.5);
        padding: 3px 5px;
        border-radius: 3px;
      }

      .image-container img {
        max-width: 100%;
        height: auto;
        display: block;
        border-radius: 5px;
      }

      .stroke-color {
        width: 25px;
        height: 25px;
        display: inline-block;
        cursor: pointer;
        border: 2px solid var(--borders);
        margin-right: 5px;
        vertical-align: middle;
        border-radius: 4px;
        transition: 0.2s;
      }

      .stroke-color:hover {
        transform: scale(1.1);
      }

      .controls {
        margin-top: 10px;
        margin-bottom: 10px;
      }

      button {
        color: #ffffff;
        background: var(--accent);
        border: 3px solid var(--borders);
        border-radius: 10px;
        padding: 8px 16px;
        margin-right: 5px;
        cursor: pointer;
        transition: 0.25s ease-in;
        font-weight: bold;
      }

      button:hover {
        background: var(--nav-hover-bg);
        color: var(--nav-hover-text);
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      input[type="color"] {
        width: 40px;
        height: 32px;
        border: 3px solid var(--borders);
        border-radius: 5px;
        cursor: pointer;
        vertical-align: middle;
      }

      input[type="range"] {
        vertical-align: middle;
        margin-left: 8px;
      }

      label {
        color: #ffffff;
        margin-right: 8px;
        font-weight: bold;
      }

      #status {
        margin-left: 10px;
        color: var(--accent-dark);
        font-weight: bold;
      }

      h3 {
        color: var(--font-color);
      }
    </style>
  </head>

  <body>
    <canvas id="drawboxcanvas" width="400" height="300"></canvas>

    <div class="controls">
      <div
        onclick="change_color(this)"
        style="background: red"
        class="stroke-color"
      ></div>
      <div
        onclick="change_color(this)"
        style="background: blue"
        class="stroke-color"
      ></div>
      <div
        onclick="change_color(this)"
        style="background: green"
        class="stroke-color"
      ></div>
      <div
        onclick="change_color(this)"
        style="background: yellow"
        class="stroke-color"
      ></div>
      <div
        onclick="change_color(this)"
        style="background: pink"
        class="stroke-color"
      ></div>
      <div
        onclick="change_color(this)"
        style="background: purple"
        class="stroke-color"
      ></div>
      <div
        onclick="change_color(this)"
        style="background: black"
        class="stroke-color"
      ></div>
      <input
        type="color"
        oninput="stroke_color = this.value"
        style="vertical-align: middle"
      />

      <label>Brush Size:</label>
      <input
        type="range"
        min="1"
        max="100"
        oninput="stroke_width = this.value"
        style="vertical-align: middle"
      />
    </div>

    <div class="controls">
      <button onclick="Restore()">Undo</button>
      <button onclick="Clear()">Clear</button>
      <button id="submit">Submit drawing</button>
      <span id="status"></span>
    </div>

    <h3>Submitted Drawings ☻</h3>
    <div id="gallery"></div>

    <script src="/gimmick/drawbox.js"></script>
  </body>
</html>
