<!doctype html>
<html lang="en">
  <head>
    <script src="/.nekoweb-api/static/site.js" defer></script>
    <meta charset="UTF-8" />
    <title>The Confessional</title>
    <link
      rel="stylesheet"
      href="/confession-css/confessionstyle.css?v=1783551651808"
    />
    <link
      rel="icon"
      type="image/webp"
      href="https://files.catbox.moe/tbhr8j.png"
    />
  </head>
  <body>
    <nav class="gothic-nav">
      <a href="/" class="nav-typewriter">HOME</a>
    </nav>
    <main>
      <div class="letter-container">
        <form
          id="gothic-askbox"
          action="https://api.web3forms.com/submit"
          method="POST"
        >
          <input
            type="hidden"
            name="access_key"
            value="b722acad-d4a1-4eb3-be2f-1ec4b4460cbb"
          />
          <input
            type="checkbox"
            name="botcheck"
            class="hidden"
            style="display: none"
          />
          <textarea
            id="message"
            name="message"
            required
            placeholder="Leave a confession..."
          ></textarea>
          <button
            type="submit"
            id="submit-btn"
            aria-label="Seal and Send"
          ></button>
        </form>
        <p id="status-message"></p>
      </div>

      <div class="confession-scroll">
        <div class="scroll-top"></div>
        <div class="scroll-middle">
          <div class="letter-text">
            <div class="the-question">"Why is the sky red today?"</div>
            <div class="the-answer">
              <p>Because you are looking through the stained glass.</p>
            </div>
          </div>
          <hr class="ink-divider" />
        </div>
        <div class="scroll-bottom"></div>
      </div>

      <script src="/js/confession.js?v=1783551651797" defer="defer"></script>
    </main>
  </body>
</html>
